<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="color-scheme" content="dark light">
<script>
// Set the saved (or device) theme before the first paint, so there is no flash of the wrong one.
(function () { var t = null; try { t = localStorage.getItem("mg_theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t === "light" ? "#f1f4f9" : "#05070c"); })();
</script>
<script>
// Row spacing, accent colour and contrast saved on this device (see src/lib/display.js), set before the first paint too.
(function () { try { var d = JSON.parse(localStorage.getItem("mg_display") || "{}"), e = document.documentElement;
  e.setAttribute("data-density", d.density === "compact" ? "compact" : "comfortable"); e.setAttribute("data-accent", ["teal", "orange", "violet"].indexOf(d.accent) > -1 ? d.accent : "blue"); e.setAttribute("data-contrast", d.contrast === true ? "high" : "normal"); } catch (x) {} })();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>MADEG GENERAL TRADING PLC · MG Auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<noscript>MG Auto needs JavaScript to run.</noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
