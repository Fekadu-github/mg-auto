<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>MG Auto Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--pn:#0e1626;--ln:#1f2c47;--tx:#e8eefb;--mu:#8fa0c2;--bl:#2f7bff;--gr:#5cb72e;--rd:#e5484d;--ok:#0b1d10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="dark"]){}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,Segoe UI,Arial,sans-serif}
h1,h2,h3,.cn{font-family:'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.02em;margin:0}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;border-bottom:2px solid var(--bl);background:linear-gradient(90deg,#0a1a3a,var(--bg) 60%)}
.logo{font:700 30px 'Barlow Condensed',sans-serif;color:var(--bl)}.logo b{color:#dfe6f5}
.tag{color:var(--gr);font-style:italic;font-size:13px}
header .sp{flex:1}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;background:#0a1120;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
nav{display:flex;gap:4px;padding:8px 16px;overflow-x:auto;border-bottom:1px solid var(--ln)}
nav button{background:none;border:0;color:var(--mu);font:600 18px 'Barlow Condensed',sans-serif;padding:6px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--gr)}
main{padding:16px;max-width:1100px;margin:auto}
.g{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px}
.stat{font:700 38px 'Barlow Condensed',sans-serif;color:var(--bl)}
button.b{background:var(--bl);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
button.b.gr{background:var(--gr);color:#07140a}button.b.ol{background:none;border:1px solid var(--ln);color:var(--tx)}button.b.rd{background:var(--rd)}
button.b:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:13px}
tr.k{cursor:pointer}tr.k:hover{background:#111c33}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#14264d;color:#9cc0ff}
.pill.g{background:var(--ok);color:#8fe05a}.pill.a{background:#33260a;color:#f4c15a}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}.steps span{font-size:12px;padding:3px 8px;border-radius:4px;background:#0a1120;color:var(--mu);border:1px solid var(--ln)}.steps span.d{background:var(--ok);color:#8fe05a;border-color:#1c4a1e}.steps span.c{border-color:var(--bl);color:#fff}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--bl);border-radius:10px;width:min(860px,96vw);max-height:92vh;padding:18px}
dialog::backdrop{background:#000a}
.mu{color:var(--mu)}.r{text-align:right}.mt{margin-top:14px}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;padding:0}#print *{color:#000}:root{padding:0}}
.doc{font:13px Arial,sans-serif;max-width:720px;margin:auto}.doc table td,.doc table th{border-bottom:1px solid #999;padding:4px}.doc h2{font-size:22px}
.pos{max-width:300px;font:12px monospace}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:o .15s}@keyframes o{from{opacity:0;transform:translateY(6px)}}}
</style><style id="pgs"></style></head><body>
<header><div><div class="logo">MG <b>AUTO</b></div><div class="tag">Your car, our care</div></div><div class="sp"></div>
<span id="who" class="mu"></span><button id="so" class="b ol" onclick="out()">Sign out</button></header>
<nav id="nav"></nav><main id="v"></main><dialog id="dlg"></dialog><div id="print"></div>
<script src="/config.js"></script>
<script>
const ROLES={SA:'Service Advisor',WS:'Workshop Supervisor',TECH:'Technician',ADMIN:'Administrator'};
const ST=['Created','Dispatched','At workshop','Work done','Back with SA','Closed','Invoiced','Delivered'];
const NM={Created:'Created',Dispatched:'Dispatched to workshop','At workshop':'Received by workshop','Work done':'Workshop finished','Back with SA':'Received by SA',Closed:'Closed',Invoiced:'Invoiced',Delivered:'Delivered'};
const API=(window.API_URL||'').replace(/\/$/,'');
let tok=null,me=null;try{tok=localStorage.getItem('tok');me=JSON.parse(localStorage.getItem('me')||'null')}catch(e){}
if(!me)tok=null;
const SEC=['Regular Service','Mechanical Repairs','Body & Paints'];
const today=()=>new Date(Date.now()+3*36e5).toISOString().slice(0,10); // Addis Ababa date
let db={c:[],v:[],j:[],p:[],cfg:{}},users=[],tab='dash',open=null,q='',iq='',sec='',rep={from:today(),to:today(),rev:null,hrs:null,err:''};
const $=s=>document.querySelector(s);
const rl=()=>me.role,isSA=()=>['SA','ADMIN'].includes(rl());
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=t=>t?new Date(t).toLocaleString([], {dateStyle:'short',timeStyle:'short'}):'';
const val=id=>($('#'+id)||{}).value?.trim()||'';
const cust=id=>db.c.find(x=>x.id==id)||{},veh=id=>db.v.find(x=>x.id==id)||{},job=id=>db.j.find(x=>x.id==id);
const r2=n=>Math.round((n+Number.EPSILON)*100)/100,VATR=()=>db.cfg.vat??.15,pct=t=>Math.round(t.rate*1000)/10;
function tot(j){const l=r2(j.labours.reduce((s,x)=>s+x.price,0)),p=r2(j.parts.reduce((s,x)=>s+x.qty*x.price,0)),sub=r2(l+p),vat=r2(sub*VATR());return{l,p,sub,vat,total:r2(sub+vat),rate:VATR()}}
function snap(j,d){const t=d&&d.totals;return t?{l:t.labour,p:t.parts,sub:t.sub,vat:t.vat,total:t.total,rate:t.rate}:tot(j)} // issued documents keep the amounts they were issued with
const NOT=(v='both')=>`<div><label>Notify when vehicle is ready</label><select id="cf">${[['both','SMS + Telegram'],['sms','SMS only'],['telegram','Telegram only'],['none','Do not notify']].map(([k,n])=>`<option value="${k}" ${k==v?'selected':''}>${n}</option>`).join('')}</select></div>`;
function csv(name,rows){const f=v=>`"${String(v??'').replace(/"/g,'""')}"`,b=new Blob(['\ufeff'+rows.map(r=>r.map(f).join(',')).join('\r\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const hrs=l=>l.logs.reduce((s,x)=>s+((x.out||Date.now())-x.in),0)/36e5,active=l=>l.logs.find(x=>!x.out);
async function api(p,m='GET',b){
 let r;try{r=await fetch(API+'/api'+p,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined})}
 catch(e){throw new Error('Cannot reach the server. Check your connection and try again.')}
 const d=await r.json().catch(()=>({}));
 if(r.status==401&&tok){out();throw new Error('Session expired. Sign in again.')}
 if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function sync(){db=await api('/data');if(rl()=='ADMIN')users=await api('/users')}
function out(){tok=me=null;try{localStorage.removeItem('tok');localStorage.removeItem('me')}catch(e){}R()}
function login(){$('#who').textContent='';$('#so').style.display='none';$('#nav').innerHTML='';
 $('#v').innerHTML=`<div class="box" style="max-width:360px;margin:40px auto"><h2>Sign in</h2><div class="mt"><label for="lu">Username</label><input id="lu" autocomplete="username"></div><div class="mt"><label for="lp2">Password</label><input id="lp2" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&A.login()"></div><div class="mt"><button class="b" onclick="A.login()">Sign in</button></div></div>`}
const W=f=>async(...a)=>{try{await f(...a);await sync();R();if($('#dlg').open&&open)M()}catch(e){alert(e.message)}};
function staffView(){return `<h1>Staff</h1><div class="box mt"><h3>New staff account</h3><div class="row"><div><label>Full name</label><input id="un"></div><div><label>Username</label><input id="uu"></div><div><label>Password (8+ characters)</label><input id="up" type="password"></div><div><label>Role</label><select id="ur"><option value="SA">Service Advisor</option><option value="WS">Workshop Supervisor</option><option value="TECH">Technician</option><option value="ADMIN">Administrator</option></select></div><button class="b" onclick="A.addUser()">Create account</button></div></div><div class="tw mt"><table><tr><th>Name</th><th>Username</th><th>Role</th></tr>${users.map(u=>`<tr><td>${E(u.name)}</td><td>${E(u.username)}</td><td>${ROLES[u.role]}</td></tr>`).join('')}</table></div>`}
const A={
 async login(){try{const d=await api('/auth/login','POST',{username:val('lu'),password:val('lp2')});tok=d.token;me=d.user;localStorage.setItem('tok',tok);localStorage.setItem('me',JSON.stringify(me));await sync();R()}catch(e){alert(e.message)}},
 tab(t){tab=t;open=null;R()},
 view(id){open=id;M()},
 addCust:W(async()=>{if(!val('cn')||!val('cp'))throw new Error('Name and phone are required.');await api('/customers','POST',{name:val('cn'),phone:val('cp'),city:val('cc'),sub:val('cs'),woreda:val('cw'),house:val('ch'),dob:val('cd')||null,notify:val('cf')||'both'})}),
 vehForm(cid){D(`<h2>Add vehicle for ${E(cust(cid).name)}</h2><div class="row mt"><div><label>Plate</label><input id="vp"></div><div><label>VIN</label><input id="vv"></div><div><label>Engine number</label><input id="ve"></div><div><label>Colour</label><input id="vc"></div><div><label>Model</label><input id="vm" placeholder="e.g. Toyota Rav4"></div></div><div class="row mt"><button class="b" onclick="A.addVeh('${cid}')">Save vehicle</button><button class="b ol" onclick="X()">Cancel</button></div>`)},
 jcForm(){if(!db.c.length)return alert('Add a customer first.');
  D(`<h2>New job card</h2><div class="row mt"><div><label>Customer</label><select id="jc" onchange="A.vopts()">${db.c.map(c=>`<option value="${c.id}">${E(c.name)} (${c.id})</option>`).join('')}</select></div><div><label>Vehicle</label><select id="jv"></select></div></div><div class="mt"><label>Customer complaint / notes</label><input id="jn"></div><div class="row mt"><button class="b" onclick="A.addJC()">Create job card</button><button class="b ol" onclick="X()">Cancel</button></div>`);A.vopts()},
 vopts(){const vs=db.v.filter(v=>v.cid==val('jc'));$('#jv').innerHTML=vs.length?vs.map(v=>`<option value="${v.id}">${E(v.plate)} · ${E(v.model)}</option>`).join(''):'<option value="">No vehicle – add one in Customers</option>'},

 editCust(id){const c=cust(id);D(`<h2>Edit ${E(c.name)}</h2><div class="row mt">${[['cn','Name','name'],['cp','Phone','phone'],['cc','City','city'],['cs','Subcity','sub'],['cw','Woreda','woreda'],['ch','House','house']].map(([i,l,k])=>`<div><label>${l}</label><input id="${i}" value="${E(c[k])}"></div>`).join('')}<div><label>Date of birth</label><input id="cd" type="date" value="${E(c.dob)}"></div>${NOT(c.notify)}</div><div class="row mt"><button class="b" onclick="A.saveCust('${id}')">Save changes</button><button class="b ol" onclick="X()">Cancel</button></div>`)},
 saveCust:W(async id=>{await api('/customers/'+id,'PUT',{name:val('cn'),phone:val('cp'),city:val('cc'),sub:val('cs'),woreda:val('cw'),house:val('ch'),dob:val('cd')||null,notify:val('cf')||'both'});X()}),
 editVeh(id){const v=veh(id);D(`<h2>Edit vehicle ${E(v.plate)}</h2><div class="row mt">${[['vp','Plate','plate'],['vv','VIN','vin'],['ve','Engine number','eng'],['vc','Colour','col'],['vm','Model','model']].map(([i,l,k])=>`<div><label>${l}</label><input id="${i}" value="${E(v[k])}"></div>`).join('')}</div><div class="row mt"><button class="b" onclick="A.saveVeh('${id}')">Save changes</button><button class="b ol" onclick="X()">Cancel</button></div>`)},
 saveVeh:W(async id=>{await api('/vehicles/'+id,'PUT',{plate:val('vp'),vin:val('vv'),eng:val('ve'),col:val('vc'),model:val('vm')});X()}),
 addVeh:W(async cid=>{if(!val('vp'))throw new Error('Plate is required.');await api('/customers/'+cid+'/vehicles','POST',{plate:val('vp'),vin:val('vv'),eng:val('ve'),col:val('vc'),model:val('vm')});X()}),
 addJC:W(async()=>{if(!val('jv'))throw new Error('Choose a vehicle. Add one under Customers first.');const j=await api('/jobs','POST',{cid:val('jc'),vid:val('jv'),note:val('jn')});open=j.id}),
 addLab:W(id=>{if(!val('ld'))return;return api(`/jobs/${id}/labour`,'POST',{desc:val('ld'),section:val('ls'),price:parseFloat(val('lp'))||0})}),
 delLab:W((id,l)=>api(`/jobs/${id}/labour/${l}`,'DELETE')),
 findPart(t){t=(t||'').trim().toLowerCase();return db.p.find(x=>(x.code+' · '+x.name).toLowerCase()==t||x.code.toLowerCase()==t)},
 partHint(){const p=A.findPart(val('pn')),h=$('#phint'),pp=$('#pp');if(!h)return;pp.disabled=!!p;if(p){pp.value=p.price;h.textContent=`${p.stock} in stock · unit price ${money(p.price)} (from the stock list)`}else h.textContent=val('pn')?'Not in the stock list: stock will not be tracked for this line.':''},
 addPart:W(id=>{const t=val('pn');if(!t)return;const p=A.findPart(t),qty=parseFloat(val('pq'))||1;return api(`/jobs/${id}/parts`,'POST',p?{pid:p.id,qty}:{name:t,qty,price:parseFloat(val('pp'))||0})}),
 delPart:W((id,i)=>api(`/jobs/${id}/parts/${i}`,'DELETE')),
 go:W((id,to)=>api(`/jobs/${id}/status`,'POST',{to})),
 wsFinish:W(id=>api(`/jobs/${id}/status`,'POST',{to:'Work done'})),
 close:W(id=>{const j=job(id);if(!confirm(`Check before closing ${id}:\n\nLabour items: ${j.labours.length} (all completed)\nParts lines issued: ${j.parts.length}\n\nClose the job card? The customer will be told the vehicle is ready.`))return;return api(`/jobs/${id}/status`,'POST',{to:'Closed'})}),
 cin:W((id,l)=>api(`/jobs/${id}/labour/${l}/clockin`,'POST')),
 cout:W((id,l)=>api(`/jobs/${id}/labour/${l}/clockout`,'POST',{reason:val('rs_'+l)||'Lunch'})),
 sup:W((id,l)=>api(`/jobs/${id}/labour/${l}/clockout`,'POST',{reason:'Supervisor command'})),
 addUser:W(()=>api('/users','POST',{name:val('un'),username:val('uu'),password:val('up'),role:val('ur')})),
 async invoice(id,type){try{await api(`/jobs/${id}/invoice`,'POST',{type});await sync();R();M();const j=job(id);A.printInv(id,type=='Proforma'?[...j.log].reverse().find(x=>x.doc&&x.doc.type=='Proforma').doc:j.inv)}catch(e){alert(e.message)}},
 printInv(id,d){const j=job(id);d=d||j.inv;const c=cust(j.cid),v=veh(j.vid),t=snap(j,d),pos=d.type!='Proforma';
  const rows=j.labours.map(l=>`<tr><td>${E(l.desc)}</td><td>1</td><td class="r">${money(l.price)}</td></tr>`).concat(j.parts.map(p=>`<tr><td>${E(p.name)}</td><td>${p.qty}</td><td class="r">${money(p.qty*p.price)}</td></tr>`)).join('');
  P(`<div class="doc ${pos?'pos':''}"><h2>MG AUTO — Mudez General Trading PLC</h2><div>Guredshola, Around Top Ten Hotel, Addis Ababa · 0980766566</div><h3 style="margin:10px 0">${d.type} invoice ${d.no}</h3><div>${dt(d.date)} · ${j.id}</div><div>${E(c.name)} · ${E(c.phone)}</div><div>${E(v.plate)} · ${E(v.model)}</div><table style="width:100%;margin-top:8px"><tr><th>Item</th><th>Qty</th><th class="r">Amount</th></tr>${rows}<tr><td colspan="2">Subtotal</td><td class="r">${money(t.sub)}</td></tr><tr><td colspan="2">VAT ${pct(t)}%</td><td class="r">${money(t.vat)}</td></tr><tr><td colspan="2"><b>Total (ETB)</b></td><td class="r"><b>${money(t.total)}</b></td></tr></table>${d.type=='Credit'?'<p>Payment type: CREDIT</p>':''}<p>Your car, our care.</p></div>`,pos)},
 async deliver(id){try{await api('/jobs/'+id+'/status','POST',{to:'Delivered'});await sync();R();M()}catch(e){return alert(e.message)}A.voucher(id)},
 voucher(id){const j=job(id),c=cust(j.cid),v=veh(j.vid),dl=[...j.log].reverse().find(x=>x.s=='Delivered');
  P(`<div class="doc"><h2>MG AUTO — Vehicle delivery voucher</h2><p>${j.id} · ${dt(dl?dl.t:Date.now())}</p><p>Customer: ${E(c.name)} (${c.id}) · ${E(c.phone)}</p><p>Vehicle: ${E(v.plate)} · ${E(v.model)} · ${E(v.col)} · VIN ${E(v.vin)}</p><p>Invoice: ${j.inv?j.inv.no:''}</p><p>The vehicle above has been handed over to the customer.</p><br><br><table style="width:100%"><tr><td>Service Advisor: ________</td><td>Customer: ________</td></tr></table></div>`)},

 // ---- customer notifications
 async tgLink(id){try{const d=await api(`/customers/${id}/telegram-link`,'POST');D(`<h2>Telegram link for ${E(cust(id).name)}</h2><p class="mt">Send this link to the customer, or open it on their phone. When they tap <b>Start</b> in Telegram they are linked and will get a message when the vehicle is ready.</p><div class="box mt" style="word-break:break-all">${E(d.url)}</div><div class="row mt"><button class="b" onclick="navigator.clipboard.writeText('${E(d.url)}').then(()=>alert('Copied'))">Copy link</button><button class="b ol" onclick="X()">Close</button></div>`)}catch(e){alert(e.message)}},
 async loadNt(id){const el=$('#nt');if(!el)return;try{const n=await api(`/jobs/${id}/notifications`),j=job(id);
  el.innerHTML=(n.length?`<div class="tw"><table><tr><th>When</th><th>Channel</th><th>To</th><th>Result</th></tr>${n.map(x=>`<tr><td>${dt(x.at)}</td><td>${E(x.channel)}</td><td>${E(x.to_addr)}</td><td><span class="pill ${x.status=='sent'?'g':x.status=='failed'?'a':''}">${x.status}</span> <span class="mu">${E(x.error||'')}</span></td></tr>`).join('')}</table></div>`:'No message sent yet.')+(isSA()&&['Closed','Invoiced'].includes(j.status)?`<div class="mt"><button class="b ol" onclick="A.notify('${id}')">Send "vehicle ready" message again</button></div>`:'');
  if(!n.length&&j.status=='Closed'&&!A._r){A._r=1;setTimeout(()=>{A._r=0;A.loadNt(id)},3000)}}catch(e){el.textContent=e.message}},
 notify:W(async id=>{await api(`/jobs/${id}/notify`,'POST')}),

 // ---- parts stock
 addPartDef:W(async()=>{if(!val('ic')||!val('inm'))throw new Error('Part code and name are required.');await api('/inventory','POST',{code:val('ic'),name:val('inm'),price:parseFloat(val('ipr'))||0,stock:parseFloat(val('ist'))||0,reorder:parseFloat(val('irl'))||0})}),
 recvForm(id){const p=db.p.find(x=>x.id==id);D(`<h2>Receive stock · ${E(p.code)} ${E(p.name)}</h2><p class="mu">Now in stock: ${p.stock}</p><div class="row mt"><div><label>Quantity received</label><input id="rq" type="number" min="0.01" step="any"></div><div style="flex:3 1 200px"><label>Note (supplier, invoice no.)</label><input id="rn"></div></div><div class="row mt"><button class="b" onclick="A.recv('${id}')">Add to stock</button><button class="b ol" onclick="X()">Cancel</button></div>`)},
 recv:W(async id=>{await api(`/inventory/${id}/receive`,'POST',{qty:parseFloat(val('rq')),note:val('rn')});X()}),
 countForm(id){const p=db.p.find(x=>x.id==id);D(`<h2>Stock count · ${E(p.code)} ${E(p.name)}</h2><p class="mu">The system says: ${p.stock}</p><div class="row mt"><div><label>Counted quantity</label><input id="kq" type="number" min="0" step="any"></div><div style="flex:3 1 200px"><label>Reason (required)</label><input id="kn" placeholder="e.g. monthly count, damaged"></div></div><div class="row mt"><button class="b" onclick="A.count('${id}')">Set stock to counted quantity</button><button class="b ol" onclick="X()">Cancel</button></div>`)},
 count:W(async id=>{await api(`/inventory/${id}/adjust`,'POST',{count:parseFloat(val('kq')),note:val('kn')});X()}),
 editPartForm(id){const p=db.p.find(x=>x.id==id);D(`<h2>Edit ${E(p.code)}</h2><div class="row mt"><div style="flex:3 1 200px"><label>Name</label><input id="en" value="${E(p.name)}"></div><div><label>Unit price (before VAT)</label><input id="ep" type="number" min="0" value="${p.price}"></div><div><label>Reorder level</label><input id="er" type="number" min="0" value="${p.reorder}"></div></div><p class="mu">A price change applies to parts issued from now on; parts already on job cards keep their price.</p><div class="row mt"><button class="b" onclick="A.savePart('${id}')">Save</button><button class="b ol" onclick="A.retire('${id}')">Retire part</button><button class="b ol" onclick="X()">Cancel</button></div>`)},
 savePart:W(async id=>{await api('/inventory/'+id,'PUT',{name:val('en'),price:parseFloat(val('ep'))||0,reorder:parseFloat(val('er'))||0});X()}),

 return `<h1>Parts stock</h1>${low.length?`<div class="box mt"><b>${low.length} part(s) at or below reorder level:</b> ${low.map(p=>E(p.code)).join(', ')}</div>`:''}

 <div class="mt"><input id="isr" placeholder="Search by code or name" value="${E(iq)}" oninput="iq=this.value;R();const e=$('#isr');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>

function repView(){const tech=rl()=='TECH',r=rep.rev,h=rep.hrs;
 let o=`<h1>${tech?'My hours':'Reports'}</h1><div class="box mt"><div class="row"><div><label>From</label><input type="date" value="${rep.from}" onchange="rep.from=this.value"></div><div><label>To</label><input type="date" value="${rep.to}" onchange="rep.to=this.value"></div><button class="b" onclick="A.runRep()">Show</button><button class="b ol" onclick="A.repToday()">Today</button></div>${rep.err?`<p style="color:var(--rd)">${E(rep.err)}</p>`:''}<p class="mu">Days are Addis Ababa days.${tech?'':' Revenue counts cash and credit invoices on the day they were issued; proformas are quotes and are not counted.'}</p></div>`;
 if(r){const m=r.sum;o+=`<div class="row mt"><h2 style="flex:1">Revenue</h2><button class="b ol" onclick="A.csvRev()">Download CSV</button></div><div class="g g2 mt">${[['Invoices',m.count],['Cash invoices',money(m.cash)],['Credit invoices (to collect)',money(m.credit)],['Total incl. VAT (ETB)',money(m.total)]].map(([a,b])=>`<div class="box"><div class="stat" style="font-size:30px">${b}</div>${a}</div>`).join('')}</div>
  <div class="tw mt"><table><tr><th>Day</th><th class="r">Invoices</th><th class="r">Cash</th><th class="r">Credit</th><th class="r">Labour</th><th class="r">Parts</th><th class="r">VAT</th><th class="r">Total</th></tr>${r.days.map(d=>`<tr><td>${d.day}</td><td class="r">${d.count}</td><td class="r">${money(d.cash)}</td><td class="r">${money(d.credit)}</td><td class="r">${money(d.labour)}</td><td class="r">${money(d.parts)}</td><td class="r">${money(d.vat)}</td><td class="r"><b>${money(d.total)}</b></td></tr>`).join('')||'<tr><td colspan="8" class="mu">No invoices in this period.</td></tr>'}</table></div>
  ${r.invoices.length?`<h3 class="mt">Invoices</h3><div class="tw"><table><tr><th>Issued</th><th>Invoice</th><th>Job card</th><th>Customer</th><th>Plate</th><th>Type</th><th class="r">Total</th></tr>${r.invoices.map(x=>`<tr class="k" onclick="A.view('${x.jc}')"><td>${dt(x.date)}</td><td>${E(x.no)}</td><td>${x.jc}</td><td>${E(x.customer)}</td><td>${E(x.plate)}</td><td>${x.type}</td><td class="r">${money(x.total)}</td></tr>`).join('')}</table></div>`:''}`}
 if(h){const techs=[...new Set(h.byDay.map(x=>x.tech))].sort(),days=[...new Set(h.byDay.map(x=>x.day))],get=(d,t)=>(h.byDay.find(x=>x.day==d&&x.tech==t)||{}).hours;
  o+=`<div class="row mt"><h2 style="flex:1">Technician hours · ${h.total.toFixed(2)} h</h2><button class="b ol" onclick="A.csvHrs()">Download CSV</button></div><p class="mu">Time between clock-in and clock-out on labour. A clock that is still running counts up to now.</p>
  <div class="tw"><table><tr><th>Technician</th><th class="r">Hours</th><th class="r">Job cards</th><th class="r">Labour items</th><th class="r">Completed</th><th></th></tr>${h.byTech.map(t=>`<tr><td>${E(t.tech)}</td><td class="r"><b>${t.hours.toFixed(2)}</b></td><td class="r">${t.jobs}</td><td class="r">${t.labours}</td><td class="r">${t.completed}</td><td>${t.open?'<span class="pill a">still clocked in</span>':''}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">No clocked time in this period.</td></tr>'}</table></div>
  ${days.length?`<h3 class="mt">By day</h3><div class="tw"><table><tr><th>Day</th>${techs.map(t=>`<th class="r">${E(t)}</th>`).join('')}</tr>${days.map(d=>`<tr><td>${d}</td>${techs.map(t=>`<td class="r">${get(d,t)!=null?get(d,t).toFixed(2):''}</td>`).join('')}</tr>`).join('')}</table></div>`:''}
  ${h.bySection.length&&!tech?`<h3 class="mt">By section</h3><div class="tw"><table><tr><th>Section</th><th class="r">Hours</th></tr>${h.bySection.map(x=>`<tr><td>${E(x.section)}</td><td class="r">${x.hours.toFixed(2)}</td></tr>`).join('')}</table></div>`:''}`}
 if(!r&&!h)o+=`<p class="mu mt">Choose the dates and press <b>Show</b>.</p>`;return o}

 const parts=j.parts.map((p,i)=>`<tr><td>${p.code?`<span class="mu">${E(p.code)}</span> `:''}${E(p.name)}</td><td>${p.qty}</td><td>${money(p.price)}</td><td>${money(p.qty*p.price)}</td><td>${SAe&&si<5?`<button class="b ol" onclick="A.delPart('${j.id}',${i})">Remove</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">No parts issued.</td></tr>';
 let act='';
 if(SAe){ if(j.status=='Created')act=`<button class="b" onclick="A.go('${j.id}','Dispatched')">Dispatch to workshop</button>`;

  if(j.status=='Delivered')act=`<button class="b ol" onclick="A.printInv('${j.id}')">Reprint invoice</button> <button class="b ol" onclick="A.voucher('${j.id}')">Reprint delivery voucher</button>`}
 if(WSe&&j.status=='Dispatched')act=`<button class="b gr" onclick="A.go('${j.id}','At workshop')">Receive job card</button>`;if(WSe&&work)act=`<button class="b gr" onclick="A.wsFinish('${j.id}')">Dispatch back to Service Advisor</button>`;
 if(j.status=='At workshop'&&!WSe&&!SAe)act='';
 D(`<div class="row"><h2 style="flex:1">${j.id} <span class="pill">${NM[j.status]}</span></h2><button class="b ol" onclick="X()">Close window</button></div>
 <div class="steps">${steps}</div>
 <div class="g g2"><div class="box"><b>${E(c.name)}</b> <span class="mu">${c.id}</span><br>${E(c.phone)}<br><span class="mu">${E([c.city,c.sub,c.woreda,c.house].filter(Boolean).join(', '))}</span></div>
 <div class="box"><b>${E(v.plate)}</b> · ${E(v.model)}<br><span class="mu">VIN ${E(v.vin)} · Engine ${E(v.eng)} · ${E(v.col)}</span></div></div>
 ${j.note?`<p class="mu">Notes: ${E(j.note)}</p>`:''}

 ${['Closed','Invoiced','Delivered'].includes(j.status)&&r!='TECH'?`<h3 class="mt">Customer notification</h3><div id="nt" class="mu">Loading…</div>`:''}
 <div class="box mt r">Labour ${money(t.l)} · Parts ${money(t.p)} · VAT ${pct(t)}% ${money(t.vat)}<br><b class="cn" style="font-size:24px">Total ETB ${money(t.total)}</b></div>
 <div class="row mt">${act||'<span class="mu">No action for your role at this stage.</span>'}</div>`);A.loadNt(j.id)}
