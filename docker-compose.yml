# Whole system on one machine: MySQL + the API with the React app.  docker compose up -d --build
# Then open http://localhost:3000 and sign in with ADMIN_USER / ADMIN_PASS from a .env file next to this one (see below).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mg_auto
      MYSQL_USER: mgauto
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: mysql://mgauto:${DB_PASSWORD}@db:3306/mg_auto
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?set ADMIN_PASS in .env}
      LABOUR_RATE: ${LABOUR_RATE:-350}
      VAT_RATE: ${VAT_RATE:-0.15}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
volumes:
  dbdata:
